<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PocketMesh</title>
<meta name="description" content="Polygon modeler for iPhone: primitives, extrude, inset, loop cut, UV unwrapping, textures, OBJ/FBX/DAE/glTF export.">
<meta name="theme-color" content="#101020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PocketMesh">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=cube">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=cube">
<style>
/* Layout: one-screen modeling app — header + option bar, viewport (3D / UV / split), operator shelf. Single dark look by design. */
:root {
  color-scheme: dark;
  --chrome: #101020;      /* app chrome */
  --panel: #1b1b2b;       /* sheets, bars */
  --panel-2: #252538;     /* raised controls */
  --panel-3: #313149;     /* hover / pressed */
  --line: #41415b;
  --fg: #e7e9ef;
  --fg-dim: #9ba2b3;
  --fg-faint: #6a7183;
  --sel: #9275ff;         /* cube-logo blue-purple */
  --sel-bright: #c6b6ff;
  --sel-ink: #100b26;
  --on: #b5a0ff;          /* toggled-on state */
  --on-bg: #30264f;
  --danger: #ff6170;
  --ax-x: #f2506b; --ax-y: #86cf38; --ax-z: #4b9df6;
  --view-top: #31353f; --view-bot: #24272e;
  --ui: -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 9px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { background: var(--chrome); }
body { position: fixed; inset: 0; background: var(--chrome); color: var(--fg); font-family: var(--ui); font-size: 15px; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; touch-action: manipulation; }
input, select { font: inherit; color: var(--fg); }
#app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }

/* ---------- top bars ---------- */
.bar { display: flex; align-items: center; gap: 4px; min-width: 0; padding-block: 6px; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); background: var(--chrome); }
#top { overflow: hidden; border-bottom: 1px solid #0c0d10; padding-top: max(6px, env(safe-area-inset-top, 0px)); }
#sub { padding-block: 4px 6px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
#sub::-webkit-scrollbar { display: none; }
#sub > .segrow { display: flex; flex-wrap: nowrap; flex: 0 0 auto; gap: 3px; }
#sub > .segrow button { padding: 5px 11px; min-height: 32px; }
#sub > .btn { flex: 0 0 auto; white-space: nowrap; }
.trackCatalog summary { cursor: pointer; font-weight: 600; }
.trackCatalog details > div { padding: 6px 0; font-size: 13px; }
.spacer { flex: 1; }
.ib { width: 36px; height: 36px; display: inline-grid; place-items: center; border: 0; border-radius: var(--r); background: transparent; cursor: pointer; flex: none; }
.ib svg { width: 21px; height: 21px; }
#btnMenu { position: relative; }
#btnMenu img { display: block; width: 34px; height: 34px; border-radius: 8px; }
#btnMenu svg { position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; padding: 1px; border-radius: 3px; background: var(--panel); }
.sheet-head h2 { display: flex; align-items: center; gap: 10px; }
.brand-logo { width: 40px; height: 40px; border-radius: 9px; flex: none; }
.ib:active, .chip:active, .pill:active { background: var(--panel-3); }
.ib:disabled { opacity: .35; }
.ib.on, .chip.on { background: var(--on-bg); color: var(--on); }
.pill { height: 34px; padding: 0 11px; min-width: 0; border: 1px solid var(--line); border-radius: 999px; background: var(--panel-2); font-weight: 600; letter-spacing: .01em; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; }
.pill .car { opacity: .6; font-size: 11px; }
.seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 2px; gap: 2px; }
.seg button { width: 34px; height: 30px; border: 0; border-radius: 8px; background: transparent; display: grid; place-items: center; cursor: pointer; }
.seg button svg { width: 20px; height: 20px; }
.seg button.on { background: var(--sel); color: var(--sel-ink); }
.chip { height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; flex: none; font-size: 14px; }
.chip svg { width: 17px; height: 17px; }
.chip .lbl { color: var(--fg-dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.vsep { width: 1px; height: 22px; background: var(--line); flex: none; margin: 0 2px; }

/* ---------- workspace ---------- */
#work { position: relative; min-height: 0; display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr; }
#work.split { grid-template-rows: 1fr 1fr; }
@media (orientation: landscape) and (min-width: 700px) { #work.split { grid-template-rows: 1fr; grid-template-columns: 1fr 1fr; } }
.pane { position: relative; min-height: 0; min-width: 0; overflow: hidden; }
#pane3d { background: linear-gradient(var(--view-top), var(--view-bot)); }
#paneUV { background: #1c1f25; border-top: 1px solid var(--line); }
#work.v-3d #paneUV, #work.v-uv #pane3d { display: none; }
canvas.view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.ovl { position: absolute; z-index: 2; }
#stats { left: 62px; top: 8px; right: 112px; font: 11px/1.4 var(--mono); color: var(--fg-dim); pointer-events: none; text-shadow: 0 1px 2px #000a; white-space: pre-wrap; }
#stats b { color: var(--fg); font-weight: 600; }
.toolcol { left: 8px; top: 8px; display: flex; flex-direction: column; gap: 3px; padding: 4px; background: #1b1e24e6; border: 1px solid var(--line); border-radius: 12px; max-height: calc(100% - 16px); overflow-y: auto; scrollbar-width: none; }
.toolcol::-webkit-scrollbar { display: none; }
#work.split .toolcol button { width: 36px; height: 34px; }
#work.split .navbtns .big { display: none; }
#work.split #nav { width: 80px; height: 80px; }
#work.split .navbtns button { width: 34px; height: 34px; }
.toolcol button { width: 40px; height: 40px; border: 0; border-radius: 9px; background: transparent; display: grid; place-items: center; cursor: pointer; }
.toolcol button svg { width: 22px; height: 22px; }
.toolcol button.on { background: var(--on-bg); color: var(--on); }
.toolcol hr { border: 0; border-top: 1px solid var(--line); margin: 2px 4px; }
#navwrap { right: 6px; top: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
#nav { width: 92px; height: 92px; touch-action: none; display: block; }
.navbtns { display: flex; flex-direction: column; gap: 3px; }
.navbtns button { width: 38px; height: 38px; border: 0; border-radius: 50%; background: #1b1e24cc; display: grid; place-items: center; cursor: pointer; touch-action: none; }
.navbtns button svg { width: 20px; height: 20px; }
.navbtns button.on { color: var(--on); background: var(--on-bg); }
.navbtns button.shade { color: var(--sel); }
#boxrect { position: absolute; border: 1.5px dashed #fff; background: #ffffff12; pointer-events: none; z-index: 3; }
#hint { left: 50%; transform: translateX(-50%); top: 8px; background: #000b; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 14px; pointer-events: none; max-width: 70%; text-align: center; }
#toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: 86%; text-align: center; box-shadow: 0 6px 20px #0008; pointer-events: none; }
#toast.err { border-color: var(--danger); color: #ffd6da; }

/* redo (adjust last operation) */
#redo { left: 8px; bottom: 8px; background: #1b1e24f2; border: 1px solid var(--line); border-radius: 12px; min-width: 190px; max-width: min(320px, 70vw); z-index: 4; }
#redo summary { list-style: none; padding: 8px 12px; font-weight: 600; cursor: pointer; display: flex; gap: 8px; align-items: center; }
#redo summary::-webkit-details-marker { display: none; }
#redo summary::before { content: "▸"; color: var(--fg-dim); transition: transform .15s; }
#redo[open] summary::before { transform: rotate(90deg); }
#redoBody { padding: 0 12px 10px; display: grid; gap: 8px; max-height: 44vh; overflow: auto; }

/* ---------- fields ---------- */
.field { display: grid; grid-template-columns: minmax(84px, 40%) 1fr; align-items: center; gap: 8px; font-size: 14px; }
.field > span { color: var(--fg-dim); }
.num { width: 100%; min-width: 0; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); padding: 0 8px; font: 16px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.num:focus, select:focus, input[type=text]:focus { outline: 2px solid var(--on); outline-offset: 0; }
select, input[type=text] { width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); padding: 0 8px; font-size: 16px; }
input, textarea { -webkit-user-select: text; user-select: text; }
.xyz { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.xyz label { position: relative; }
.xyz label::before { content: attr(data-ax); position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font: 600 12px var(--mono); pointer-events: none; }
.xyz label[data-ax=X]::before { color: var(--ax-x); } .xyz label[data-ax=Y]::before { color: var(--ax-y); } .xyz label[data-ax=Z]::before { color: var(--ax-z); }
.xyz .num { padding-left: 20px; }
input[type=range] { width: 100%; accent-color: var(--sel); }
input[type=color] { width: 100%; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); padding: 2px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; min-height: 34px; }
.check input { width: 20px; height: 20px; accent-color: var(--sel); }

/* ---------- shelf ---------- */
#shelf { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; background: var(--chrome); border-top: 1px solid var(--line); padding-top: 6px; padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
#shelf::-webkit-scrollbar { display: none; }
#shelf button { flex: none; min-width: 62px; height: 54px; padding: 4px 6px; border: 0; border-radius: 10px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12.5px; font-weight: 500; letter-spacing: .02em; color: var(--fg); cursor: pointer; }
#shelf button svg { width: 22px; height: 22px; }
#shelf button:active { background: var(--panel-3); }
#shelf button.sub::after { content: ""; display: block; width: 14px; height: 2px; border-radius: 2px; background: var(--fg-faint); margin-top: -1px; }
#shelf .grp { flex: none; width: 1px; background: var(--line); margin: 8px 2px; }

/* modal transform bar replaces the shelf */
#tfbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: var(--panel); border-top: 2px solid var(--sel); padding-top: 8px; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
#tfbar .title { font-weight: 700; font-size: 16px; min-width: 56px; }
#tfbar .info { flex: 1 1 100%; order: -1; font: 12.5px var(--mono); color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#tfbar .ax { width: 40px; height: 38px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel-2); font: 700 15px var(--mono); cursor: pointer; }
#tfbar .ax[data-ax=x] { color: var(--ax-x); } #tfbar .ax[data-ax=y] { color: var(--ax-y); } #tfbar .ax[data-ax=z] { color: var(--ax-z); }
#tfbar .ax.on { background: currentColor; }
#tfbar .ax.on span { color: #111; }
#tfbar .ax.loc { outline: 2px solid #fff; outline-offset: -4px; }
#tfbar .tfnum { width: 92px; height: 38px; }
#tfbar .ok { background: var(--sel); color: var(--sel-ink); border: 0; border-radius: 10px; height: 38px; padding: 0 16px; font-weight: 700; cursor: pointer; }
#tfbar .cancel { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; height: 38px; padding: 0 12px; cursor: pointer; }
#tfbar .grow { flex: 1; }
#tfbar input[type=range] { flex: 1 1 120px; min-width: 100px; }

/* ---------- sheets ---------- */
#scrim { position: fixed; inset: 0; background: #0007; z-index: 40; }
#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 80%; display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 30px #0009; padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .16s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: .4; } }
@media (prefers-reduced-motion: reduce) { #sheet { animation: none; } }
@media (min-width: 760px) { #sheet { left: auto; right: 10px; bottom: 10px; top: auto; width: 380px; max-height: calc(100% - 20px); border-radius: 16px; border: 1px solid var(--line); } }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px 16px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; font-size: 18px; font-weight: 700; flex: 1; letter-spacing: .01em; }
#sheetBody { overflow: auto; padding: 8px 12px 14px; display: grid; gap: 10px; align-content: start; }
.mi { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 6px 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; cursor: pointer; }
.mi:active { background: var(--panel-3); }
.mi svg { width: 21px; height: 21px; color: var(--fg-dim); }
.mi .t { font-size: 16px; font-weight: 500; }
.mi .d { display: block; font-size: 12.5px; color: var(--fg-faint); font-weight: 400; margin-top: 1px; }
.mi .k { font: 11.5px var(--mono); color: var(--fg-faint); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.mi.danger .t { color: var(--danger); }
.mgrp { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-faint); padding: 8px 10px 0; }
.menu { display: grid; gap: 1px; }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.card h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-dim); font-weight: 600; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-3); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--sel); color: var(--sel-ink); border-color: transparent; }
.btn.danger { color: var(--danger); }
.btn svg { width: 18px; height: 18px; }
.btn:disabled { opacity: .45; }
.brres-preview { width: 100%; height: 180px; object-fit: contain; image-rendering: pixelated; border-radius: 8px; background: repeating-conic-gradient(#30343d 0% 25%, #232730 0% 50%) 0 0 / 20px 20px; }
.brres-error { color: var(--danger); margin: 0; }
.brres-materials { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; max-height: 180px; overflow-y: auto; }
.brres-material { display: grid; gap: 3px; width: 100%; padding: 9px; text-align: left; overflow-wrap: anywhere; background: var(--panel-3); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.brres-material .muted { font-size: 12px; }
.slot { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; }
.slot.on { border-color: var(--sel); background: #9275ff14; }
.swatch { width: 30px; height: 30px; border-radius: 7px; border: 1px solid #0006; flex: none; background-size: cover; background-position: center; }
.texprev { width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 10px; border: 1px solid var(--line); background: #111 center/contain no-repeat; image-rendering: auto; }
.texprev.px { image-rendering: pixelated; }
.olrow { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; cursor: pointer; }
.olrow.sel { background: #9275ff1c; } .olrow.act .nm { color: var(--sel); font-weight: 700; }
.olrow .nm { flex: 1; font-size: 16px; }
.olrow .meta { font: 11px var(--mono); color: var(--fg-faint); }
.muted { color: var(--fg-dim); font-size: 13.5px; line-height: 1.4; }
.segrow { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--chrome); border-radius: 10px; padding: 3px; }
.segrow button { height: 34px; border: 0; border-radius: 8px; background: transparent; font-weight: 600; cursor: pointer; }
.segrow button.on { background: var(--panel-3); color: var(--sel); }
/* notch-safe overlay offsets (landscape) */
.toolcol { left: calc(8px + env(safe-area-inset-left, 0px)); }
#stats { left: calc(62px + env(safe-area-inset-left, 0px)); right: calc(112px + env(safe-area-inset-right, 0px)); }
#redo { left: calc(8px + env(safe-area-inset-left, 0px)); }
#navwrap { right: calc(6px + env(safe-area-inset-right, 0px)); }
#uvtools { left: calc(8px + env(safe-area-inset-left, 0px)); }
/* short screens (phone landscape): both bars share one row, compact controls */
@media (max-height: 520px) {
  #app { grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
  #top { grid-column: 1; grid-row: 1; padding-right: 4px; border-bottom: 1px solid var(--line); }
  #sub { grid-column: 2; grid-row: 1; padding-left: 4px; padding-top: max(6px, env(safe-area-inset-top, 0px)); padding-bottom: 6px; }
  #work { grid-column: 1 / -1; grid-row: 2; }
  #shelf, #tfbar { grid-column: 1 / -1; grid-row: 3; }
  #shelf button { height: 46px; font-size: 12px; }
  #shelf button svg { width: 20px; height: 20px; }
  #tfbar { padding-top: 6px; }
  #tfbar .info { flex-basis: auto; order: 0; flex: 1 1 140px; }
  .navbtns .big { display: none; }
  #nav { width: 78px; height: 78px; }
  .toolcol button, .navbtns button { width: 36px; height: 34px; }
  #sheet { max-height: 92%; }
}
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--fg-dim); }
.welcome { display: grid; gap: 8px; font-size: 15px; line-height: 1.45; }
.welcome b { color: var(--sel); font-weight: 600; }
:focus-visible { outline: 2px solid var(--on); outline-offset: 1px; }
.collision-material-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px; }
.collision-material { display:flex;flex-direction:column;gap:4px;text-align:left;padding:7px;border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow-wrap:anywhere;cursor:pointer;min-width:0; }
.collision-material.on { border-color:var(--on);background:var(--on-bg); }
.collision-material span,.collision-material strong { font-size:12px; }
.collision-preview { display:block;width:100%;height:72px;object-fit:contain;border-radius:5px; }
.collision-preview.large { height:160px; }
.szs-list { display:grid;gap:4px;height:280px;min-height:120px;overflow:auto;grid-auto-rows:max-content;align-content:start; }
.szs-entry { text-align:left;display:grid;gap:3px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow-wrap:anywhere;min-width:0;cursor:pointer; }
.szs-entry.on { border-color:var(--on);background:var(--on-bg); }
.szs-entry small { color:var(--fg-dim); }
.szs-folder { padding:5px 8px;font-weight:600;overflow-wrap:anywhere; }
</style>

</head>
<body>
<div id="app">
  <header id="top" class="bar">
    <button class="ib" id="btnMenu" aria-label="File menu"></button>
    <button class="pill" id="btnMode" aria-label="Interaction mode"><span id="modeLbl">Object</span><span class="car">▼</span></button>
    <div class="seg" id="selModes" hidden>
      <button data-sm="vert" aria-label="Vertex select"></button>
      <button data-sm="edge" aria-label="Edge select"></button>
      <button data-sm="face" aria-label="Face select"></button>
    </div>
    <div class="spacer"></div>
    <button class="ib" id="btnUndo" aria-label="Undo"></button>
    <button class="ib" id="btnRedo" aria-label="Redo"></button>
    <button class="ib" id="btnView" aria-label="Switch 3D / UV view"></button>
  </header>
  <div id="sub" class="bar"></div>
  <main id="work" class="v-3d">
    <section class="pane" id="pane3d">
      <canvas class="view" id="c3d"></canvas>
      <canvas class="view" id="rulerCanvas" aria-hidden="true" style="pointer-events:none"></canvas>
      <canvas class="view" id="knifeCanvas" aria-hidden="true" style="pointer-events:none"></canvas>
      <canvas class="view" id="trackCanvas" aria-hidden="true" style="pointer-events:none"></canvas>
      <div class="ovl" id="stats"></div>
      <div class="ovl toolcol" id="tools"></div>
